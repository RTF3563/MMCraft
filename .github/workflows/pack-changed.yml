# pack/ 폴더를 고쳐서 올렸을 때: (필요하면 CurseForge 가져오기) → 실행 테스트 → 배포
name: 팩 수정 배포
on:
  push:
    branches: [main]
    paths: ["pack/**"]
  workflow_dispatch:
    inputs:
      skip_test:
        description: "테스트 건너뛰기 (설정 파일만 바꿨을 때)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pack
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: ./.github/actions/prepare
      - name: CurseForge 가져오기 (mods.json이 없거나 pack/import를 고쳤을 때)
        run: |
          if [ ! -f pack/mods.json ] || git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q '^pack/import/'; then
            npm run ci:import
            git config user.name "mmcraft-bot"
            git config user.email "mmcraft-bot@users.noreply.github.com"
            git add pack
            git diff --cached --quiet || (git commit -m "CurseForge → Modrinth 가져오기" && git push)
          fi
      - name: 실행 테스트
        if: ${{ !inputs.skip_test }}
        run: xvfb-run -a -s "-screen 0 1280x720x24" npm run ci:test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-logs
          path: .ci-cache/runs/**
          if-no-files-found: ignore

  publish:
    needs: test
    uses: ./.github/workflows/_publish.yml
