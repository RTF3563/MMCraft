# pack/ 폴더를 고쳐서 올렸을 때: (필요하면 CurseForge 가져오기) → 실행 테스트 → 배포
name: 팩 수정 배포
on:
  push:
    branches: [main]
    paths: ["pack/**"]
  workflow_dispatch:
    inputs:
      skip_test:
        description: "테스트 건너뛰기 (설정 파일만 바꿨을 때)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pack
  cancel-in-progress: false

# 파이프(| tee)를 써도 실패가 실패로 잡히도록 (bash -eo pipefail)
defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: ./.github/actions/prepare
      - name: 모드 추가·삭제 요청 처리 (pack/requests.json)
        id: req
        run: |
          set -o pipefail
          if [ -f pack/requests.json ] && node -e "const r=require('./pack/requests.json');process.exit((r.add||[]).length+(r.remove||[]).length+(r.inspect||[]).length+(r.upgrade||[]).length+(r.test?1:0)?0:1)"; then
            STATUS=0
            xvfb-run -a -s "-screen 0 1280x720x24" node dist/ci/manage.js 2>&1 | tee -a ci-output.log || STATUS=$?
            git config user.name "mmcraft-bot"
            git config user.email "mmcraft-bot@users.noreply.github.com"
            git add pack
            git diff --cached --quiet || (git commit -m "모드 추가·삭제: 팩 $(node -p "require('./pack/pack.json').version")" && git push)
            echo "handled=true" >> "$GITHUB_OUTPUT"
            exit $STATUS
          fi
      - name: CurseForge 가져오기 (mods.json이 없거나 pack/import를 고쳤을 때)
        if: steps.req.outputs.handled != 'true'
        run: |
          if [ ! -f pack/mods.json ] || git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q '^pack/import/'; then
            npm run ci:import 2>&1 | tee -a ci-output.log
            git config user.name "mmcraft-bot"
            git config user.email "mmcraft-bot@users.noreply.github.com"
            git add pack
            git diff --cached --quiet || (git commit -m "CurseForge → Modrinth 가져오기" && git push)
          fi
      - name: 실행 테스트
        if: ${{ !inputs.skip_test && steps.req.outputs.handled != 'true' }}
        run: xvfb-run -a -s "-screen 0 1280x720x24" npm run ci:test 2>&1 | tee -a ci-output.log
      - name: 실패 로그 올리기
        if: failure()
        uses: ./.github/actions/report-logs
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-logs
          path: .ci-cache/runs/**
          if-no-files-found: ignore

  publish:
    needs: test
    uses: ./.github/workflows/_publish.yml
