# 런처 설치 파일 만들기: package.json의 version을 올려서 push하면 Releases에
#   MMCraft-Setup-x.y.z.exe (플레이어 런처) + MMCraft-Server-Setup-x.y.z.exe (서버 런처) 생성
# (설치된 런처는 이 Releases를 보고 스스로 업데이트: 플레이어 런처 latest.yml, 서버 런처 server.yml)
name: 런처 배포
on:
  push:
    branches: [main]
    paths: ["package.json"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci 2>&1 | tee -a ci-output.log
        shell: bash
      - run: npm test 2>&1 | tee -a ci-output.log
        shell: bash
      - name: 설치 파일 빌드 + Releases 업로드
        shell: bash
        run: npm run release:win 2>&1 | tee -a ci-output.log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MMCRAFT_AZURE_CLIENT_ID: ${{ vars.MMCRAFT_AZURE_CLIENT_ID }}
      - name: 서버 런처 설치 파일 빌드 + 같은 Releases에 업로드
        shell: bash
        run: npm run release:server 2>&1 | tee -a ci-output.log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Releases 공개 (초안 → 공개)
        shell: bash
        run: |
          V="v$(node -p "require('./package.json').version")"
          cp "release/MMCraft-Setup-${V#v}.exe" release/MMCraft-Setup.exe
          cp "release/MMCraft-Server-Setup-${V#v}.exe" release/MMCraft-Server-Setup.exe
          gh release upload "$V" release/MMCraft-Setup.exe release/MMCraft-Server-Setup.exe --clobber 2>&1 | tee -a ci-output.log
          gh release edit "$V" --draft=false --latest --title "MMCraft 런처 $V" 2>&1 | tee -a ci-output.log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 실패 로그 올리기
        if: failure()
        uses: ./.github/actions/report-logs
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
