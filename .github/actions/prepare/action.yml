name: prepare
description: Node + 게임 실행 테스트 환경 (가상 화면, 소프트웨어 OpenGL, 가상 사운드) + 캐시
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - name: 테스트용 시스템 패키지
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libxrandr2 libxcursor1 libxi6 libxxf86vm1 pulseaudio > /dev/null
        pulseaudio --start --exit-idle-time=-1 || true
    - name: 게임 파일 캐시
      uses: actions/cache@v4
      with:
        path: |
          .ci-cache/libraries
          .ci-cache/assets
          .ci-cache/runtime
          .ci-cache/versions
          .ci-cache/mod-cache
          .ci-cache/server-jars
        key: mc-${{ hashFiles('pack/pack.json') }}-${{ github.run_id }}
        restore-keys: |
          mc-${{ hashFiles('pack/pack.json') }}-
          mc-
    - shell: bash
      run: npm ci && npm run build
      env:
        ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
